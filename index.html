<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Folkrace</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:#87ceeb;
}

#car{
    position:absolute;
    width:80px;
    height:40px;
    background:red;
    left:300px;
    top:300px;
    border-radius:8px;
}

#speed{
    position:absolute;
    top:10px;
    left:10px;
    color:white;
    font-size:30px;
    font-family:Arial;
    font-weight:bold;
}
</style>

</head>
<body>

<div id="speed">0 km/h</div>
<div id="car"></div>

<script>

const car =
document.getElementById("car");

const speedText =
document.getElementById("speed");

let x = 300;
let y = 300;

let angle = 0;
let speed = 0;

const keys = {};

document.addEventListener(
"keydown",
e=>{
 keys[e.key]=true;
}
);

document.addEventListener(
"keyup",
e=>{
 keys[e.key]=false;
}
);

function update(){

 if(
 keys["w"] ||
 keys["ArrowUp"]
 ){
  speed += 0.1;
 }

 if(
 keys["s"] ||
 keys["ArrowDown"]
 ){
  speed -= 0.1;
 }

 speed *= 0.98;

 if(
 keys["a"] ||
 keys["ArrowLeft"]
 ){
  angle -= 3;
 }

 if(
 keys["d"] ||
 keys["ArrowRight"]
 ){
  angle += 3;
 }

 x +=
 Math.cos(
 angle*Math.PI/180
 ) * speed;

 y +=
 Math.sin(
 angle*Math.PI/180
 ) * speed;

 car.style.left =
 x + "px";

 car.style.top =
 y + "px";

 car.style.transform =
 `rotate(${angle}deg)`;

 speedText.innerText =
 Math.abs(
 Math.round(
 speed*10
 )
 ) + " km/h";

 requestAnimationFrame(
 update
 );

}

update();

</script>

</body>
</html>
